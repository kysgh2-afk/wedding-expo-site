name: Wedding schedule health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  issues: write

concurrency:
  group: wedding-schedule-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the live Cloudways schedule feed
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 \
              "https://weddinglast.com/api/schedule-status?health_run=${GITHUB_RUN_ID}-${attempt}"; then
              exit 0
            fi
            sleep 20
          done
          exit 1
      - name: Record failure for the owner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title='Wedding schedule update needs attention'
          body="The Cloudways schedule feed is stale, incomplete, or unavailable. The last valid public data remains in place. Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
