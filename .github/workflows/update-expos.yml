name: Daily wedding schedules
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *' # Midnight Asia/Seoul (GitHub may delay execution)
    - cron: '17 * * * *' # Health check and recovery
permissions:
  contents: write
  issues: write
concurrency:
  group: wedding-schedule-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decide whether refresh is needed
        id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$SCHEDULE" = "0 15 * * *" ] || ! curl --fail --silent --max-time 30 https://weddinglast.com/api/schedule-status >/dev/null; then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Test calendar boundaries
        if: steps.check.outputs.refresh == 'true'
        run: node --test scripts/expo-calendar.test.mjs scripts/expo-data-health.test.mjs
      - name: Collect and validate (three attempts)
        if: steps.check.outputs.refresh == 'true'
        run: |
          for attempt in 1 2 3; do
            if node scripts/update-expos.mjs && node scripts/validate-expos.mjs; then exit 0; fi
            sleep 20
          done
          exit 1
      - name: Save only schedules to latest main
        if: steps.check.outputs.refresh == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/expos.generated.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh verified wedding schedules'
          git pull --rebase origin main
          node scripts/validate-expos.mjs
          git push origin HEAD:main
      - name: Deploy and verify live schedules
        if: steps.check.outputs.refresh == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: node scripts/verify-schedule-deploy.mjs
      - name: Record failure for the owner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title='Wedding schedule update needs attention'
          body="Automatic schedule update or live verification failed. Last successful data was not intentionally removed. Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
